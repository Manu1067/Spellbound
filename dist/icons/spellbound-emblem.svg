<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4DD" />
      <stop offset="35%" stop-color="#D6B46A" />
      <stop offset="70%" stop-color="#AA8438" />
      <stop offset="100%" stop-color="#6E5119" />
    </linearGradient>
    <radialGradient id="sealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D6B46A" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D6B46A" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="50" cy="50" r="48" fill="url(#sealGlow)" />
  
  <!-- Outer Ornate Ring -->
  <circle cx="50" cy="50" r="44" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 3" />
  <circle cx="50" cy="50" r="40" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Cardinal Runes / Dots -->
  <circle cx="50" cy="8" r="1.5" fill="#D6B46A" />
  <circle cx="92" cy="50" r="1.5" fill="#D6B46A" />
  <circle cx="50" cy="92" r="1.5" fill="#D6B46A" />
  <circle cx="8" cy="50" r="1.5" fill="#D6B46A" />
  
  <!-- Interlocking Celestial Octagram -->
  <polygon points="50,15 58,35 78,35 62,48 68,68 50,56 32,68 38,48 22,35 42,35" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.65" />
  <polygon points="50,22 55,38 72,38 59,48 64,64 50,54 36,64 41,48 28,38 45,38" stroke="url(#goldGrad)" stroke-width="1" fill="#151D35" fill-opacity="0.8" />
  
  <!-- Central Astrolabe Ring -->
  <circle cx="50" cy="50" r="15" stroke="url(#goldGrad)" stroke-width="1.5" />
  <circle cx="50" cy="50" r="11" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="1 2" />
  
  <!-- Central Diamond Star of Eldoria -->
  <path d="M50 37 L53 47 L63 50 L53 53 L50 63 L47 53 L37 50 L47 47 Z" fill="url(#goldGrad)" />
  <circle cx="50" cy="50" r="2.5" fill="#FFFFFF" />
</svg>
